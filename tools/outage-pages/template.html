<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
/* Palette: theme.json / tools/ci/lint_palette_hex.py PALETTE values only. No font files, no requests. */
:root {
	--page: #f3f6fa;
	--frame: #ffffff;
	--frame-line: #dbe2eb;
	--ink: #173258;
	--ink-muted: #46628a;
	--action: #0c5fc1;
	--action-hover: #00499c;
	--on-action: #ffffff;
	--focus: #0c5fc1;
	--sky: #173258;
	--sky-ink: #fbfbfb;
	--sky-muted: #b2c6e2;
	--shadow: 0 28px 64px -32px rgba(10, 31, 60, 0.45);
	--font-body: "DM Sans", DMSans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	--font-display: ui-rounded, "SF Pro Rounded", Quicksand, "DM Sans", DMSans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
	:root {
		--page: #0a1f3c;
		--frame: #0a1f3c;
		--frame-line: #20406c;
		--ink: #fbfbfb;
		--ink-muted: #b2c6e2;
		--action: #7db3ff;
		--action-hover: #a4caff;
		--on-action: #0a1f3c;
		--focus: #93d1e8;
		--shadow: none;
	}
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
	margin: 0;
	min-height: 100vh;
	min-height: 100dvh;
	display: grid;
	place-items: center;
	padding: 24px 16px;
	background: var(--page);
	color: var(--ink);
	font: 400 1.0625rem/1.6 var(--font-body);
}
::selection { background: #7db3ff; color: #0a1f3c; }
.frame {
	width: min(1120px, 100%);
	display: grid;
	background: var(--frame);
	border: 1px solid var(--frame-line);
	border-radius: 28px;
	overflow: hidden;
	box-shadow: var(--shadow);
}
.sky {
	position: relative;
	display: flex;
	flex-direction: column;
	gap: 8px;
	padding: 20px 20px 16px;
	background: var(--sky);
	color: var(--sky-ink);
}
.logo { display: block; width: 132px; height: auto; }
.scene { display: block; width: 100%; height: auto; max-height: 150px; margin: 0; }
.status {
	margin: 0;
	display: flex;
	align-items: center;
	gap: 10px;
	color: var(--sky-muted);
	font-size: 0.9375rem;
	font-weight: 500;
}
.status svg { flex: none; }
.copy { padding: 28px 20px 32px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; color: var(--ink); text-wrap: balance; }
h1 {
	margin: 0 0 16px;
	font-size: clamp(2rem, 1.35rem + 2.6vw, 3.25rem);
	line-height: 1.08;
	letter-spacing: -0.02em;
}
h1::after {
	content: "";
	display: block;
	width: 40px;
	height: 3px;
	margin-top: 20px;
	border-radius: 2px;
	background: #93d1e8;
}
p { margin: 0 0 16px; max-width: 62ch; }
.lede { font-size: 1.125rem; color: var(--ink); }
.reach {
	margin-top: 24px;
	padding-top: 20px;
	border-top: 1px solid var(--frame-line);
}
h2 { margin: 0 0 8px; font-size: 1.375rem; line-height: 1.25; }
.reach p { color: var(--ink-muted); }
.button {
	display: inline-flex;
	align-items: center;
	gap: 12px;
	min-height: 52px;
	margin-top: 8px;
	padding: 14px 24px;
	border-radius: 999px;
	background: var(--action);
	color: var(--on-action);
	font-weight: 600;
	font-size: 1.0625rem;
	line-height: 1.2;
	text-decoration: none;
	overflow-wrap: anywhere;
	transition: background-color 160ms ease-out;
}
.button:hover { background: var(--action-hover); }
.button:focus { outline: none; }
.button:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
.button svg { flex: none; }
@media (max-width: 479px) {
	.button { display: flex; justify-content: center; gap: 10px; padding: 14px 18px; font-size: 1rem; }
}
.small { margin: 28px 0 0; font-size: 0.875rem; color: var(--ink-muted); }
@media (min-width: 880px) {
	body { padding: 40px 32px; }
	.frame { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 560px; }
	.sky { padding: 40px 40px 36px; gap: 16px; }
	.logo { width: 216px; }
	.scene { flex: 1; max-height: none; margin: 0; }
	.copy { display: flex; flex-direction: column; justify-content: center; padding: 56px 64px; }
}
/* Motion: the drone holds position, rotors spin, the uplink searches. Stops under reduced motion. */
.drone { animation: hover 3.6s ease-in-out infinite; }
.rotor { transform-box: fill-box; transform-origin: center; animation: spin 0.22s linear infinite alternate; }
.link { animation: march 1.6s linear infinite; }
.ping { opacity: 0.2; animation: ping 2.4s ease-out infinite; }
.ping.p2 { animation-delay: 0.3s; }
.ping.p3 { animation-delay: 0.6s; }
.beacon { animation: blink 2.4s ease-out infinite; }
@keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes spin { from { transform: scaleX(1); } to { transform: scaleX(0.35); } }
@keyframes march { to { stroke-dashoffset: -28; } }
@keyframes ping { 0% { opacity: 0.15; } 20% { opacity: 1; } 60%, 100% { opacity: 0.15; } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation: none !important; transition: none !important; }
	.ping { opacity: 0.6; }
}
</style>
</head>
<body>
<main class="frame">
	<div class="sky">
		<svg class="logo" viewBox="226 333 575 358" width="216" height="134" role="img" aria-label="UplinkSync"><title>UplinkSync</title>{{LOGO}}</svg>
		<svg class="scene" viewBox="16 72 452 200" width="452" height="200" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
			<ellipse cx="316" cy="132" rx="138" ry="36" fill="none" stroke="#46628a" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
			<path d="M24 262H456" stroke="#46628a" stroke-width="2" stroke-linecap="round"/>
			<g fill="none" stroke="#b2c6e2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
				<path d="M76 262L88 222L100 262"/>
				<path d="M80 249H96"/>
				<path d="M74 214a20 20 0 0 1 28-12"/>
			</g>
			<circle class="beacon" cx="88" cy="219" r="5" fill="#93d1e8"/>
			<path class="link" d="M104 206C150 156 180 136 212 128" fill="none" stroke="#7db3ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 11"/>
			<g class="drone">
				<g transform="translate(316 120) scale(1.3)">
					<g fill="none" stroke="#b2c6e2" stroke-width="3" stroke-linecap="round">
						<path class="ping" d="M-58 4a20 20 0 0 1 0-16"/>
						<path class="ping p2" d="M-70 10a34 34 0 0 1 0-28"/>
						<path class="ping p3" d="M-82 16a48 48 0 0 1 0-40"/>
					</g>
					<path d="M-28-4L-46-16M28-4L46-16" stroke="#fbfbfb" stroke-width="4" stroke-linecap="round"/>
					<rect x="-49" y="-24" width="6" height="9" rx="2" fill="#fbfbfb"/>
					<rect x="43" y="-24" width="6" height="9" rx="2" fill="#fbfbfb"/>
					<ellipse class="rotor" cx="-46" cy="-26" rx="24" ry="3.5" fill="#b2c6e2"/>
					<ellipse class="rotor" cx="46" cy="-26" rx="24" ry="3.5" fill="#b2c6e2"/>
					<rect x="-34" y="-10" width="68" height="20" rx="10" fill="#579af6"/>
					<rect x="-18" y="-5" width="36" height="5" rx="2.5" fill="#173258" opacity="0.35"/>
					<path d="M-20 10L-26 24M20 10L26 24M-32 24H-20M20 24H32" stroke="#fbfbfb" stroke-width="3" stroke-linecap="round"/>
					<circle cx="0" cy="15" r="7" fill="#e2eeff"/>
					<circle cx="0" cy="16" r="3" fill="#173258"/>
				</g>
			</g>
		</svg>
		<p class="status"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><circle class="beacon" cx="6" cy="6" r="5" fill="#93d1e8"/></svg>{{STATUS}}</p>
	</div>
	<div class="copy">
		<h1>{{HEADLINE}}</h1>
		<p class="lede">{{BODY}}</p>
		<section class="reach" aria-labelledby="reach-title">
			<h2 id="reach-title">Need a person now?</h2>
			<p>Email reaches us even while the website is down. We typically reply within one business day.</p>
			<a class="button" href="mailto:contact@uplinksync.com"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>Email contact@uplinksync.com</a>
		</section>
		<p class="small">UplinkSync: managed IT, websites and FAA Part 107 aerial work, from the server room to the sky.</p>
	</div>
</main>
</body>
</html>
