include:
  - project: '***'
    ref: main
    file: '/templates/wordpress-site.gitlab-ci.yml'

variables:
  THEME_SLUG: "hostinger-ai-theme"
  # render_smoke fails the MR if the rendered homepage body is smaller than this
  # many bytes. The ***-132 incident shipped an HTTP-200 *empty* body (mu-plugin
  # ob_start fatal); any real render is many KB, so 500 cleanly separates the two.
  SMOKE_MIN_BYTES: "500"
  # Optional: substring the ***-132 MR sets to its unified-narrative marker so the
  # gate also proves the intended copy rendered (not just "non-empty"). Empty = skip.
  SMOKE_EXPECT: ""

# ***-154: real-host render-verification gate for the homepage (***-132 unblocker).
#
# The MR preview is edge-gated by Vault basic-auth (***),
# unreachable from an agent run env — so external QA of the rendered page is impossible.
# This job renders the front page *inside* the already-running preview container instead,
# bypassing the edge auth entirely, and fails the pipeline BEFORE merge if the body is
# empty/undersized. It reproduces the exact incident class (ob_start callback fatal in a
# mu-plugin, interacting with a sibling output buffer) because it drives the full front
# controller via index.php with every mu-plugin buffer active — a real render, not a
# local string transform (which is precisely what missed the ***-132 fatal).
render_smoke:
  stage: review
  image: docker:27-cli
  needs:
    - job: review_deploy
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_STRATEGY: none
  script:
    # Recompute the container name review_deploy created (project-id-prefixed slug,
    # 58-char cap) so we exec into the same preview WordPress.
    - export PREVIEW_SLUG="$(echo "$CI_PROJECT_ID-$CI_COMMIT_REF_SLUG" | cut -c1-58)"
    - export PREVIEW_HOST="$PREVIEW_SLUG.$PREVIEW_DOMAIN"
    - export WP_CTN="preview-$PREVIEW_SLUG-wordpress-1"
    - echo "Rendering homepage in-process inside $WP_CTN (host $PREVIEW_HOST)"
    # Emulate an HTTPS GET / so is_ssl() is true and WP does NOT canonical-redirect us
    # away from the render; capture the full rendered body; a fatal in any mu-plugin
    # output buffer surfaces as a non-zero exit / undersized body -> pipeline fails.
    - |
      docker exec \
        -e PROBE_HOST="$PREVIEW_HOST" \
        -e SMOKE_MIN_BYTES="$SMOKE_MIN_BYTES" \
        -e SMOKE_EXPECT="$SMOKE_EXPECT" \
        -u www-data -w /var/www/html "$WP_CTN" \
        php -d display_errors=stderr -r '
          $_SERVER["HTTP_HOST"]     = getenv("PROBE_HOST");
          $_SERVER["SERVER_NAME"]   = getenv("PROBE_HOST");
          $_SERVER["SERVER_PORT"]   = "443";
          $_SERVER["HTTPS"]         = "on";
          $_SERVER["REQUEST_URI"]   = "/";
          $_SERVER["REQUEST_METHOD"]= "GET";
          register_shutdown_function(function () {
            $e = error_get_last();
            if ($e && in_array($e["type"], [E_ERROR, E_PARSE, E_CORE_ERROR, E_COMPILE_ERROR], true)) {
              fwrite(STDERR, "FAIL: fatal during homepage render: {$e["message"]} @ {$e["file"]}:{$e["line"]}\n");
              exit(1);
            }
          });
          ob_start();
          require "index.php";
          $html = ob_get_clean();
          $len  = strlen($html);
          $min  = (int) getenv("SMOKE_MIN_BYTES");
          fwrite(STDERR, "rendered homepage: {$len} bytes (min {$min})\n");
          if ($len < $min) {
            fwrite(STDERR, "FAIL: homepage body {$len} bytes < {$min} — blank/undersized render (the ***-132 incident class).\n");
            exit(1);
          }
          $expect = getenv("SMOKE_EXPECT");
          if ($expect !== "" && strpos($html, $expect) === false) {
            fwrite(STDERR, "FAIL: expected marker not found in rendered homepage: {$expect}\n");
            exit(1);
          }
          fwrite(STDERR, "PASS: homepage rendered non-empty" . ($expect !== "" ? " and contains marker" : "") . ".\n");
        '
    - echo "render_smoke PASS — homepage renders a real, non-empty body on the preview host."

# ***: forbidden-hex guard. The footer LinkedIn glyph must use the house white
# token (var(--uplinksync-white)); the raw third-party brand blue #0d66c2 / #0a66c2
# must never be hard-coded in this theme's own CSS (it fails WCAG 1.4.11 on navy and
# leaks a third-party colour into the two-colour house system). This keeps the
# ***-311 fix from silently regressing. Vendored libraries are excluded.
lint_forbidden_hex:
  stage: review
  image: python:3-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # Strip CSS comments first, then flag the forbidden hex only where it is used as
    # a real declaration value (documented mentions inside /* ... */ are allowed).
    - |
      python3 - <<'PY'
      import re, sys, glob
      bad = re.compile(r'#0[da]66c2', re.I)
      hits = []
      for f in glob.glob('wp-content/themes/uplinksync-child/assets/css/**/*.css', recursive=True):
          src = open(f, encoding='utf-8', errors='replace').read()
          src = re.sub(r'/\*.*?\*/', '', src, flags=re.S)   # drop comments
          for i, line in enumerate(src.splitlines(), 1):
              if bad.search(line):
                  hits.append(f'{f}:{i}: {line.strip()}')
      if hits:
          sys.stderr.write('FAIL: forbidden LinkedIn brand-blue hex (#0d66c2/#0a66c2) used in child-theme CSS.\n')
          sys.stderr.write('Use var(--uplinksync-white) for the footer glyph (see brand-blocks.css §7).\n')
          sys.stderr.write('\n'.join(hits) + '\n')
          sys.exit(1)
      print('PASS: no forbidden LinkedIn brand-blue hex used in child-theme CSS.')
      PY
