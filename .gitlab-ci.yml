include:
  - project: 'ops/ci-templates'
    ref: main
    file: '/templates/wordpress-site.gitlab-ci.yml'

variables:
  # The site migrated off the hostinger-ai-theme parent onto Twenty Twenty-Five
  # (style.css: "Template: twentytwentyfive"); the live theme is the child,
  # uplinksync-child. This variable was never updated.
  #
  # It is consumed by ops/ci-templates wordpress-site.gitlab-ci.yml as
  #   wp theme activate $THEME_SLUG || echo 'WARN: ... not activatable in preview'
  # — a SOFT failure. So every MR preview has been trying to activate a theme
  # that no longer exists, warning, and rendering on the container's default
  # theme instead of the site's own. That is one more reason the review app has
  # not been representative of production (see ecosystem-docs 114 §4.6, R1/R2):
  # the render_smoke gate was not even exercising this theme.
  #
  # Pointing it at the real child theme makes previews render what production
  # renders. Still soft-fail, so the worst case is the existing warning — no
  # new failure mode.
  THEME_SLUG: "uplinksync-child"
  # render_smoke floor for the WHOLE rendered document. A totally empty 200 is far
  # under this; any real render is many KB. This is the cheap first gate only —
  # showed a document can clear a byte floor (bloated <head>) yet ship an
  # EMPTY <body>, so the real assertion below is body-content-aware, not byte-only.
  SMOKE_MIN_BYTES: "500"
  # minimum VISIBLE body text (tags/script/style stripped) the homepage
  # must render. That incident returned HTTP 200 with chrome/head present but an
  # empty <body> — a byte floor passed it. A real homepage carries thousands of chars;
  # 200 cleanly separates a real page from a chrome-only/blank one without false reds.
  SMOKE_MIN_BODY_TEXT: "200"
  # Optional: substring an MR can set to its unified-narrative marker so the
  # gate also proves the intended copy rendered (not just "non-empty"). Empty = skip.
  SMOKE_EXPECT: ""

# real-host render-verification gate for the homepage.
#
# The MR preview is edge-gated by edge basic-auth,
# unreachable from an agent run env — so external QA of the rendered page is impossible.
# This job renders the front page *inside* the already-running preview container instead,
# bypassing the edge auth entirely, and fails the pipeline BEFORE merge if the body is
# empty/undersized. It reproduces the exact incident class (ob_start callback fatal in a
# mu-plugin, interacting with a sibling output buffer) because it drives the full front
# controller via index.php with every mu-plugin buffer active — a real render, not a
# local string transform (which is precisely what missed the fatal).
render_smoke:
  stage: review
  image: docker:27-cli
  needs:
    - job: review_deploy
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_STRATEGY: none
  script:
    # Recompute the container name review_deploy created (project-id-prefixed slug,
    # 58-char cap) so we exec into the same preview WordPress.
    - export PREVIEW_SLUG="$(echo "$CI_PROJECT_ID-$CI_COMMIT_REF_SLUG" | cut -c1-58)"
    - export PREVIEW_HOST="$PREVIEW_SLUG.$PREVIEW_DOMAIN"
    - export WP_CTN="preview-$PREVIEW_SLUG-wordpress-1"
    - echo "Rendering homepage in-process inside $WP_CTN (host $PREVIEW_HOST)"
    # Emulate an HTTPS GET / so is_ssl() is true and WP does NOT canonical-redirect us
    # away from the render; capture the full rendered body; a fatal in any mu-plugin
    # output buffer surfaces as a non-zero exit / undersized body -> pipeline fails.
    - |
      docker exec \
        -e PROBE_HOST="$PREVIEW_HOST" \
        -e SMOKE_MIN_BYTES="$SMOKE_MIN_BYTES" \
        -e SMOKE_MIN_BODY_TEXT="$SMOKE_MIN_BODY_TEXT" \
        -e SMOKE_EXPECT="$SMOKE_EXPECT" \
        -u www-data -w /var/www/html "$WP_CTN" \
        php -d display_errors=stderr -r '
          $_SERVER["HTTP_HOST"]     = getenv("PROBE_HOST");
          $_SERVER["SERVER_NAME"]   = getenv("PROBE_HOST");
          $_SERVER["SERVER_PORT"]   = "443";
          $_SERVER["HTTPS"]         = "on";
          $_SERVER["REQUEST_URI"]   = "/";
          $_SERVER["REQUEST_METHOD"]= "GET";
          register_shutdown_function(function () {
            $e = error_get_last();
            if ($e && in_array($e["type"], [E_ERROR, E_PARSE, E_CORE_ERROR, E_COMPILE_ERROR], true)) {
              fwrite(STDERR, "FAIL: fatal during homepage render: {$e["message"]} @ {$e["file"]}:{$e["line"]}\n");
              exit(1);
            }
          });
          ob_start();
          require "index.php";
          $html = ob_get_clean();
          $len  = strlen($html);

          $min_bytes = (int) getenv("SMOKE_MIN_BYTES");
          $min_text  = (int) getenv("SMOKE_MIN_BODY_TEXT");
          $expect    = getenv("SMOKE_EXPECT");
          $fail = function ($m) { fwrite(STDERR, "FAIL: " . $m . "\n"); exit(1); };
          fwrite(STDERR, "rendered homepage: {$len} bytes\n");

          // (a) render must COMPLETE: WP always emits a closing html tag; its absence
          //     means a fatal cut the output buffer mid-render.
          if (stripos($html, "</html>") === false) { $fail("render incomplete — no closing </html> (fatal mid-render / truncated buffer). {$len} bytes."); }

          // (b) explicit white-screen / fatal signatures that can still return HTTP 200.
          $sigs = ["There has been a critical error", "Error establishing a database connection", "Fatal error:", "Parse error:", "syntax error, unexpected", "Uncaught Error", "Uncaught TypeError", "Allowed memory size of", "Call to undefined function"];
          foreach ($sigs as $s) { if (stripos($html, $s) !== false) { $fail("white-screen/fatal signature present: \"{$s}\"."); } }

          // (c) whole-document floor (cheap catch for a totally empty 200).
          if ($len < $min_bytes) { $fail("document {$len} bytes < {$min_bytes} — blank/undersized render (a totally empty 200)."); }

          // (d) real BODY content — that incident shipped chrome/head but an EMPTY
          //     <body>. Count only VISIBLE body text (script/style/tags stripped).
          $bs = stripos($html, "<body");
          if ($bs === false) { $fail("no <body> element in render."); }
          $bs = strpos($html, ">", $bs);
          $be = stripos($html, "</body>");
          if ($bs === false || $be === false || $be <= $bs) { $fail("malformed/empty <body> in render."); }
          $body = substr($html, $bs + 1, $be - $bs - 1);
          $body_wo = preg_replace("#<(script|style|noscript)\\b[^>]*>.*?</\\1>#is", " ", $body);
          $text = trim(preg_replace("#\\s+#", " ", strip_tags($body_wo)));
          $tlen = strlen($text);
          if ($tlen < $min_text) { $fail("visible body text {$tlen} chars < {$min_text} — chrome-only / blank body (chrome/head present, empty body)."); }

          // (e) structural proof of a real page (any one landmark).
          if (!preg_match("#<h[1-3]\\b|<nav\\b|<main\\b|<header\\b#i", $body)) { $fail("no structural landmark (<h1-3>/<nav>/<main>/<header>) in body — not a real rendered page."); }

          // (f) optional exact-copy marker (opt-in via SMOKE_EXPECT).
          if ($expect !== "" && strpos($html, $expect) === false) { $fail("expected copy marker not found in rendered homepage: {$expect}"); }

          // (g) STRUCTURED DATA must be PARSEABLE. Added after a live regression on
          //     2026-08-13: a mu-plugin output-buffer rewrite converted a plain email
          //     inside a JSON-LD string value into <a href="mailto:...">, whose
          //     unescaped double quotes terminated the JSON string and made the ENTIRE
          //     ld+json block invalid. Every assertion above still PASSED, because the
          //     page rendered perfectly — only the JSON payload was corrupt. This is the
          //     assertion that would have caught it before merge.
          if (preg_match_all("#<script[^>]*application/ld\\+json[^>]*>(.*?)</script>#is", $html, $ldm)) {
            foreach ($ldm[1] as $i => $blk) {
              json_decode(trim($blk));
              if (json_last_error() !== JSON_ERROR_NONE) {
                $snippet = substr(preg_replace("#\\s+#", " ", trim($blk)), 0, 200);
                $fail("JSON-LD block #" . ($i + 1) . " is INVALID (" . json_last_error_msg() . "). This usually means an output-buffer rewrite injected markup into a JSON string value. Starts: " . $snippet);
              }
            }
            fwrite(STDERR, "json-ld: " . count($ldm[1]) . " block(s) parsed OK\n");
          } else {
            fwrite(STDERR, "json-ld: no ld+json blocks present (not asserted)\n");
          }

          fwrite(STDERR, "PASS: homepage rendered a real page — {$len} bytes, {$tlen} chars visible body text, landmark present" . ($expect !== "" ? ", marker found" : "") . ".\n");
        '
    - echo "render_smoke PASS — homepage renders a real, content-bearing body (not just a 200) on the preview host."

# forbidden-hex guard. The footer LinkedIn glyph must use the house white
# token (var(--uplinksync-white)); the raw third-party brand blue #0d66c2 / #0a66c2
# must never be hard-coded in this theme's own CSS (it fails WCAG 1.4.11 on navy and
# leaks a third-party colour into the two-colour house system). This keeps the
# fix from silently regressing. Vendored libraries are excluded.
lint_forbidden_hex:
  stage: review
  image: python:3-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # Strip CSS comments first, then flag the forbidden hex only where it is used as
    # a real declaration value (documented mentions inside /* ... */ are allowed).
    - |
      python3 - <<'PY'
      import re, sys, glob
      bad = re.compile(r'#0[da]66c2', re.I)
      hits = []
      for f in glob.glob('wp-content/themes/uplinksync-child/assets/css/**/*.css', recursive=True):
          src = open(f, encoding='utf-8', errors='replace').read()
          src = re.sub(r'/\*.*?\*/', '', src, flags=re.S)   # drop comments
          for i, line in enumerate(src.splitlines(), 1):
              if bad.search(line):
                  hits.append(f'{f}:{i}: {line.strip()}')
      if hits:
          sys.stderr.write('FAIL: forbidden LinkedIn brand-blue hex (#0d66c2/#0a66c2) used in child-theme CSS.\n')
          sys.stderr.write('Use var(--uplinksync-white) for the footer glyph (see brand-blocks.css §7).\n')
          sys.stderr.write('\n'.join(hits) + '\n')
          sys.exit(1)
      print('PASS: no forbidden LinkedIn brand-blue hex used in child-theme CSS.')
      PY

# production-REPRESENTATIVE post-deploy gate.
# The `render_smoke` job above renders the homepage inside the PREVIEW container
# (real front controller, but NOT the live auto-updated plugin stack or the real
# production DB block content). On a prior change a clean preview render PASSED while
# production served HTTP 200 with an empty <main> — root cause of two homepage
# outages in one class. This post-deploy job hits the REAL deployed URL (real
# plugins, real DB, real caches) and fails the pipeline if any checked page is
# blank/structurally degraded, so a green deploy can no longer coexist with a
# blank prod. Additive to (not a replacement for) the pre-merge render_smoke.
#
# Runs in .post on every main pipeline as a live-prod health gate. NOTE: the
# actual prod deploy is async (GitLab main -> GitHub push-mirror -> GitHub
# Actions rsync), so this GitLab job cannot observe the exact moment THIS
# deploy lands — the authoritative post-deploy gate for a given change is the
# blocking "Production render smoke" step in the GitHub deploy workflow, which
# is sequential right after the rsync + cache flush. This GitLab job is the
# complementary always-on live-prod smoke.
#
# SMOKE_BASE_URL defaults to the public prod URL below; a project CI/CD
# variable of the same name overrides it (UI variables outrank .gitlab-ci.yml),
# so no owner action is required to arm the gate.
prod_render_smoke:
  stage: .post
  # debian:bookworm-slim is a Docker Hub base image the runner can always pull
  # (the previous gitlab-build-images tag no longer resolves and hard-failed the
  # job before the script ran). It ships bash; curl + gawk are installed below.
  image: debian:bookworm-slim
  variables:
    SMOKE_BASE_URL: "https://uplinksync.com"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  timeout: 20m
  before_script:
    # UPLAA-QW12: bounded, retried install. On 2026-08-14 this job failed with
    # "Unable to connect to deb.debian.org:80" - the runner's container egress
    # is intermittently down, and an unbounded install turns that into either a
    # hard red or (on a sibling job) a one-hour hang. Retry, then fail FAST and
    # legibly so a tooling outage is never mistaken for a production defect.
    #
    # python3 (NOT python3-minimal): Debian's minimal build ships WITHOUT the
    # json module, so the JSON-LD checker crashed with ModuleNotFoundError on
    # every page and reported it as invalid-json-ld - a false red across main.
    - |
      ok=0
      for attempt in 1 2 3; do
        if timeout 150 apt-get update -qq >/dev/null 2>&1 \
           && timeout 240 apt-get install -y -qq --no-install-recommends \
                curl ca-certificates gawk python3 >/dev/null 2>&1; then
          ok=1; break
        fi
        echo "apt attempt $attempt/3 failed or timed out (runner container egress); retrying" >&2
        sleep 15
      done
      if [ "$ok" != 1 ]; then
        echo "INFRA: could not install curl/gawk/python3 - runner container egress is down." >&2
        echo "       This is a TOOLING failure, NOT a production defect. Production was" >&2
        echo "       never checked; do not read this red as a site problem." >&2
        exit 1
      fi
  script:
    - tools/ci/prod_render_smoke.sh "$SMOKE_BASE_URL"

# push-mirror health gate (UPLAA-446, follow-up to UPLAA-443).
# Deploy path is GitLab main -> GitHub push-mirror -> GitHub Actions -> live prod.
# In UPLAA-443 the GitLab push-mirror silently disabled and sat enabled:false for
# SIX DAYS: every merge to main was a no-op on live prod and nothing alerted.
#
# The direct check (GET /projects/3/remote_mirrors) needs an api-scoped GitLab
# token the runtime lacks (paperclip-push-only -> insufficient_scope). So instead
# this job observes the mirror's EFFECT with zero elevated privilege: it compares
# GitLab main's SHA against GitHub main's SHA (the GitHub mirror is readable with
# an unauthenticated git ls-remote). Persistent divergence == the mirror stalled.
#
# Runs ONLY on SCHEDULED pipelines (not on merges — a just-merged commit races the
# mirror push). Configure a pipeline schedule (Build -> Pipeline schedules, e.g.
# every 2h on main). It never runs on MR/merge pipelines, so it cannot block deploys.
#
# ALERT DELIVERY: do NOT rely on GitLab email — it's dead on this estate (no
# outbound mail since 2026-03-22). On a confirmed stall the script fires an
# out-of-band push to $MIRROR_ALERT_URL (an ntfy topic URL or webhook). Set that
# CI variable to arm the active alert; without it the job still fails (non-zero
# exit shows red in the pipeline UI) and prints a loud warning, but nothing is
# pushed. curl is added alongside git/bash so the push works from the alpine image.
mirror_sync_check:
  stage: .post
  image: alpine:3.20
  # UPLAA-QW12: bound and retry the install. Unbounded `apk add` hung for an
  # hour on a sibling job the same night; a monitoring job must fail fast and
  # legibly rather than consume a runner slot.
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - |
      ok=0
      for attempt in 1 2 3; do
        if timeout 120 apk add --no-cache git bash curl >/dev/null 2>&1; then ok=1; break; fi
        echo "apk attempt $attempt/3 failed or timed out (runner container egress); retrying" >&2
        sleep 10
      done
      if [ "$ok" != 1 ]; then
        echo "INFRA: could not install git/bash/curl - runner container egress is down." >&2
        echo "       This is a TOOLING failure, not a mirror failure. Nothing was checked." >&2
        exit 1
      fi
  script:
    - bash tools/ci/mirror_sync_check.sh

# UPLAA-QW8: does production actually serve GitHub main?
#
# mirror_sync_check (above/below) covers GitLab -> GitHub. This covers the NEXT
# hop, GitHub -> Hostinger, which had no monitoring at all until now. On
# 2026-08-14 that hop failed (transient ssh-keyscan) while this very pipeline was
# fully green - prod_render_smoke included - because the site was up and serving
# the PREVIOUS version. Green here has never meant "deployed".
#
# Scheduled-only, like mirror_sync_check: a just-merged commit races the mirror
# and the deploy, so running it on merges would produce false alarms.
deploy_landed_check:
  stage: .post
  image: alpine:3.20
  # UPLAA-QW12: NO before_script on purpose. This job previously ran
  # `apk add git bash curl`, which on 2026-08-14 hung for a FULL HOUR on the
  # runner's flaky container egress and failed the pipeline - while
  # mirror_sync_check in the SAME pipeline succeeded. The script was rewritten
  # to POSIX sh using only busybox tools (wget/grep/sed) already present in
  # alpine, so there is nothing left to install and that failure class is gone.
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - sh tools/ci/deploy_landed_check.sh
