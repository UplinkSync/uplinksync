# ── Shared job defaults ───────────────────────────────────────────────────────

.default_job:
  interruptible: true
  retry: 1
  before_script:
    - set -eu

# ── Phase control mixins ──────────────────────────────────────────────────────
#
# Advisory jobs allow pipeline success even when the check fails.
# To promote a job to blocking: remove "extends: .advisory" from the job.
# Document the promotion in docs/ci-policy-phases.md.

.advisory:
  allow_failure: true

.blocking:
  allow_failure: false

# ── Rule sets ─────────────────────────────────────────────────────────────────

.mr_only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.branch_or_mr:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.release_refs_only:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^release\/.+$/

yaml_lint:
  extends:
    - .default_job
    - .branch_or_mr
  stage: validate
  image: python:3.12-alpine
  script:
    - pip install --quiet yamllint
    - |
      yamllint \
        -d '{extends: default, rules: {line-length: {max: 160}, document-start: disable}}' \
        .

shell_script_lint:
  extends:
    - .default_job
    - .branch_or_mr
  stage: validate
  image: koalaman/shellcheck-alpine:stable
  script:
    - |
      scripts="$(find . -type f \( -name '*.sh' -o -path './.gitlab/*' \) ! -path './.git/*' | sort)"
      if [ -z "$scripts" ]; then
        echo "No shell scripts found. TODO: add repository shell scripts or narrow this search."
        exit 0
      fi
      echo "$scripts" | while IFS= read -r file; do
        [ -n "$file" ] || continue
        case "$file" in
          *.sh) shellcheck "$file" ;;
          *)
            if head -n 1 "$file" | grep -qE '^#!.*/(ba)?sh'; then
              shellcheck "$file"
            else
              echo "Skipping non-shell file: $file"
            fi
            ;;
        esac
      done

mr_lint_unit_tests:
  extends:
    - .default_job
    - .branch_or_mr
  stage: validate
  image: python:3.12-alpine
  script:
    - pip install --quiet -e .
    - python -m unittest discover -s tests -p 'test_*.py'

# PHP syntax check (`php -l`) on the custom, site-editable code only:
# mu-plugins and the active theme. Deliberately excludes the vendored
# wordpress.org/Hostinger plugins (jetpack, woocommerce, elementor,
# litespeed-cache, hostinger-*, admin-site-enhancements) and the
# default twentytwenty* themes — those aren't edited in this repo and
# linting them just adds CI time without catching real regressions.
php_syntax_check:
  extends:
    - .default_job
    - .branch_or_mr
  stage: validate
  image: php:8.3-cli-alpine
  script:
    - |
      targets="wp-content/mu-plugins wp-content/themes/hostinger-ai-theme"
      filelist="$(mktemp)"
      find $targets -type f -name '*.php' 2>/dev/null | sort > "$filelist"
      if [ ! -s "$filelist" ]; then
        echo "No custom PHP files found under: $targets"
        rm -f "$filelist"
        exit 0
      fi
      status=0
      while IFS= read -r file; do
        [ -n "$file" ] || continue
        php -l "$file" || status=1
      done < "$filelist"
      rm -f "$filelist"
      exit "$status"
